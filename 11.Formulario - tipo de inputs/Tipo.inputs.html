<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipo de inputs</title>
</head>
<body>
    <h1>Tipo de Inputs</h1>
    <form action="procesa.php" method="post">
    <fieldset>
    <p>
        <label for="Nombre">Nombre: </label>
        <input type="text" id="Nombre" name="Nombre" maxlength="20"/>
    </p>
    <p>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="contraseña" maxlength="6" />
    </p>
    <p>
        <label for="Hombre">Hombre: </label>
        <input type="radio" id="Hombre" value="H" checked name="genero"/>
        <label for="Mujer">Mujer: </label>
        <input type="radio" id="Mujer" value="M" name="genero"/>
    </p>
    <p>
        <label for="Trabajador">Trabajando actualmente: </label>
        <input type="checkbox" id="Trabajador" name="Trabajador" /> 
    </p>
    <p>
        <label for="Prov">Provincia</label>
        <select id="Prov" name="Provincia">
            <option value="" disabled selected></option>
            <option value="Al">Albacete</option>
            <option value="CR">Ciudad Real</option>
            <option value="Cu">Cuenca</option>
            <option value="Gu">Guadalajara</option>
            <option value="To">Toledo</option>
        </select>
    </p>
    <p>
        <Label for="Comment">Comentarios</Label>
        <textarea name="Comment" id="Comment" cols="50" rows="2" placeholder="Ingrese su comentario" ></textarea>
    </p>
    <p>
        <label for="Color">Color</label>
        <input type="Color" id="Color" name="Color"> 
    </p>
    <p>
        <label for="Fec.nac">Fecha de nacimiento</label>
        <input type="date" id="Fec.nac" name="Fecha.nac">
    </p>
    <p>
        <label for="Edad">Edad</label>
        <input type="number" id="Edad" name="Edad" min="0" max="100">
    </p>
    <p>
        <label for="email">Email</label>
        <input type="email" id="Email" name="Correo"
    </p>
    <p>
        <label for="teléfono">Teléfono</label>
        <input type="tel" id="Teléfono" name="Teléfono" pattern="[0-9]{9}" placeholder="123456789" title="Ingrese un número de 9 dígitos">
    </p>
    <p>
        <label for="CV">Adjuntar Curriculum</label>
        <input type="file" id="CV" name="CV">
    </p>
    </fieldset>

    <p>
        <input type="submit" value="Enviar"/>
    </p>
    <p> 
        <input type="reset" value="Limpiar"/>
    </p>  
    </form>
    <p><a href="../index.html">Volver al Índice</a></p>
</body>
</html>
